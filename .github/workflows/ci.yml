name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Vitest (component tests) and Playwright (route tests, brief
      # section 9) land with Phase B, alongside the router/data-layer
      # rebuild they test — no test suite exists yet to run here.

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations, seed and run structural RLS checks
        run: bash scripts/test_db.sh
      # supabase db advisors needs a live hosted project connection —
      # it's run against staging/production directly, not in PR CI.
      # The full 158-check acceptance suite and the 200-value source
      # comparison need one real client's seeded report, which lives
      # only in the private elevame-redesign repo (never copied here)
      # — run those from that repo instead. See supabase/README.md.
